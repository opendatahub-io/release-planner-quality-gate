# Release Quality Gate 1: Feature Definition of Ready for Planning
# Aligns to FPDoR: https://redhat.atlassian.net/wiki/spaces/RHAI/pages/442958832
# JQL discovery: planning Features in RHAISTRAT + AIPCC with Target Version
# pointing at a release whose code freeze is still in the future (bare 3.*
# names from config/release-calendar.json). Human sign-off is an AI First
# hard check — not a discovery filter.
jql:
  scopes:
    - project: RHAISTRAT
      issuetypes: [Feature, Initiative]
    - project: AIPCC
      issuetypes: [Feature]
  required_labels: []
  excluded_statuses:
    - Closed
    - Resolved
    - Cancelled
  # Prefer calendar-derived cycles (bare 3.* with a future code freeze),
  # expanded to Jira picklist names like "3.6 EA1 RHOAI RELEASE".
  # Set target_versions explicitly to override (bare 3.* or full picklist
  # names; obsolete rhoai-3.x names are rejected).
  target_versions_from_calendar: true
  calendar_path: config/release-calendar.json
  # Do not list rp-qg1-pass here. Prior passes must be re-evaluated when
  # hard-check criteria change; fingerprint skip avoids redundant Jira writes.
  # Optional opt-out labels (e.g. rp-qg1-skip) may be listed if needed.
  skip_labels: []
  order_by: key ASC

# RICE custom field IDs (Jira Prioritization tab)
rice_fields:
  reach: customfield_10862
  impact: customfield_10836
  confidence: customfield_10838
  effort: customfield_10637
  score: customfield_10864           # auto-calculated, read-only

# Confidence dropdown option IDs
confidence_options:
  "100": "16144"
  "75": "16145"
  "50": "16146"

# Quality gate labels
labels:
  gate_pass: rp-qg1-pass
  gate_fail: rp-qg1-fail
  auto_rice: rp-qg1-auto-rice

# Check definitions
checks:
  hard_checks:
    - name: has_rice
      type: field_present
      fields:
        - customfield_10862   # Reach
        - customfield_10836   # Impact
        - customfield_10838   # Confidence
        - customfield_10637   # Effort
      auto_fix: rice_scorer

    - name: has_priority
      type: field_present
      fields:
        - priority

    - name: has_pm
      type: field_present
      fields:
        - customfield_10469   # Product Manager

    - name: has_delivery_owner
      type: field_present
      fields:
        - assignee             # Delivery Owner (FPDoR)

    - name: has_sign_off
      type: label_present
      ai_first_only: true
      labels:
        - strat-creator-human-sign-off

    - name: has_rubric_pass
      type: label_present
      ai_first_only: true
      labels:
        - strat-creator-rubric-pass

    - name: has_components
      type: field_present
      fields:
        - components

    - name: has_release_type
      type: field_present
      fields:
        - customfield_10851   # Release Type

    - name: has_docs_impact
      type: docs_impact
      docs_required_field: customfield_10665   # Product Documentation Required
      documentation_component: Documentation

    - name: has_target_version
      type: field_present
      fields:
        - customfield_10855   # Target Version

    # Structural: ≥1 Epic with parent = this Feature in eng projects.
    # epic-creator-auto-decomposed is not accepted as a substitute pass.
    - name: has_child_epics
      type: has_child_epics
      engineering_projects:
        - RHOAIENG
        - RHAIENG
        - AIPCC
        - INFERENG
        - RHAI
        - RHELAI

    # Description criteria (Org Pulse description-scanner + label/field shortcuts)
    - name: has_requirements_clarity
      type: description_criterion
      criterion: requirements_clarity
      label_shortcuts:
        - strat-creator-rubric-pass
        - strat-creator-human-sign-off

    - name: has_acceptance_criteria
      type: description_criterion
      criterion: acceptance_criteria
      label_shortcuts:
        - strat-creator-rubric-pass

    - name: has_risks_assumptions
      type: description_criterion
      criterion: risks_assumptions
      label_shortcuts:
        - strat-creator-rubric-pass
        - strat-creator-human-sign-off

    - name: has_architectural_alignment
      type: description_criterion
      criterion: architectural_alignment
      label_shortcuts:
        - strat-creator-rubric-pass
        - strat-creator-human-sign-off

    - name: has_uxd_description
      type: description_criterion
      criterion: uxd_description
      accept_uxd_component: true

    - name: has_cross_team_deps
      type: description_criterion
      criterion: cross_team_deps_language
      accept_epic_creator_label: true
      accept_multi_eng_components: true

# RICE scorer configuration
rice_scorer:
  timeout_seconds: 300
  calibration_jql: >-
    project = RHAISTRAT
    AND labels = "strat-creator-human-sign-off"
    AND cf[10862] IS NOT EMPTY
